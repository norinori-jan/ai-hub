<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">

<!-- PWA対応メタタグ & マニフェスト読み込み -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ai-hub">

<title>ai-hub</title>
<style>:root{--bg:#0f1720;--card:#17212d;--line:#26344a;--tx:#e8eef6;--mu:#8fa3ba;--ac:#4fd1c5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;line-height:1.6}main{max-width:900px;margin:auto;padding:18px 14px 80px}header{display:flex;align-items:center;gap:10px;margin-bottom:16px}h1{font-size:23px;margin:0;flex:1}.sub{color:var(--mu);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}button,a.btn{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.pri{background:var(--ac);color:#102028;border-color:var(--ac);font-weight:800}.purpose{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:14px}.purpose button{text-align:left}.purpose b{display:block;font-size:15px}.continue,.next-action{display:flex;align-items:center;gap:12px}.continue .body,.next-action .body{flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.app{padding:14px;border:1px solid var(--line);border-radius:13px}.app h3{margin:0 0 3px;font-size:16px}.app p{margin:0 0 10px;color:var(--mu);font-size:12px}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:11px;color:var(--mu)}.small{min-height:36px;padding:7px 10px;font-size:13px}.next-action{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#121c27}.activity-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.activity-item{padding:10px;border:1px solid var(--line);border-radius:10px}.activity-item b{display:block;font-size:12px;color:var(--mu);margin-bottom:2px}.activity-wide{grid-column:1/-1}.status-pill{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;border:1px solid var(--ac);color:var(--ac);font-size:11px}.steps{display:flex;flex-wrap:wrap;gap:6px}.step{padding:4px 8px;border-radius:999px;background:#121c27;border:1px solid var(--line);font-size:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,var(--bg) 35%);padding:20px 14px 10px}.bottom-in{max-width:900px;margin:auto}@media(max-width:720px){.purpose{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:430px){.purpose{grid-template-columns:1fr}.activity-grid{grid-template-columns:1fr}.activity-wide{grid-column:auto}}</style>
</head>
<body>
<main>
  <header><div style="font-size:30px">🧭</div><h1>ai-hub</h1><span class="tag">personal OS</span></header>
  <section class="card">
    <h2 style="margin:0 0 4px">今日は何をする？</h2>
    <div class="sub">アプリではなく、目的から始めます。</div>
    <div class="purpose">
      <button class="pri" data-purpose="produce"><b>🎨 作る</b><span class="sub">音楽・制作・出力</span></button>
      <button data-purpose="understand"><b>🧠 整理する</b><span class="sub">意味・知識・AI</span></button>
      <button data-purpose="practice"><b>📚 学ぶ</b><span class="sub">英語・耳・AI</span></button>
      <button data-purpose="capture"><b>🎙 残す</b><span class="sub">声・アイデア・素材</span></button>
      <button data-purpose="review"><b>🔍 振り返る</b><span class="sub">意味・知識・制作</span></button>
    </div>
  </section>
  <section class="card"><h3 id="purposeTitle" style="margin:0 0 5px">次の一手</h3><div id="purposeBody" class="sub">上の目的を選んでください。</div></section>
  <section class="card" id="activityCard" style="display:none"><h3 style="margin:0 0 5px">前回の実績</h3><div id="activityBody"></div></section>
  <section class="card"><h3 style="margin:0 0 8px">▶ 続きから</h3><div id="continue"></div></section>
  <section class="card">
    <h3 style="margin:0 0 8px">今日のセッション</h3>
    <div class="actions"><button data-action="start">▶ セッション開始</button><button data-action="capture">＋ 入口にメモ</button><button data-action="clear">リセット</button></div>
    <div id="status" class="sub" style="margin-top:8px"></div>
    <div id="queue"></div>
  </section>
  <section class="card"><h3 style="margin:0 0 8px">専門アプリ</h3><div class="grid" id="apps"></div></section>
  <section class="card"><h3 style="margin:0 0 6px">設計</h3><div class="sub">録る → 整理する → 知識化する → 作る → 振り返る。ai-hubは原本を奪わず、目的・状態・次の一手だけをつなぎます。</div></section>
</main>
<div class="bottom"><div class="bottom-in"><a class="btn pri" style="width:100%" href="https://github.com/norinori-jan/ai-hub" target="_blank">GitHubで開く</a></div></div>

<script src="activity-model.js"></script>
<script>
const apps={'flow-mind':{e:'https://norinori-jan.github.io/flow-mind/',i:'🧠',group:'CORE',d:'意味・意図・因果・感情・本音を整理する。'},'quick-ref':{e:'https://norinori-jan.github.io/quick-ref/',i:'📚',group:'KNOWLEDGE',d:'知識辞書。Q&A・メモ・検索・再利用。'},'ai-dojo':{e:'https://norinori-jan.github.io/ai-dojo/',i:'🥋',group:'KNOWLEDGE',d:'AIへの依頼を鍛える。'},'speak-native':{e:'https://norinori-jan.github.io/speak-native/',i:'🗣',group:'TRAINING',d:'英語イマージョン。'},'ear-first':{e:'https://norinori-jan.github.io/ear-first/',i:'👂',group:'TRAINING',d:'耳から入る練習。'},'voice-pad':{e:'https://norinori-jan.github.io/voice-pad/',i:'🎙',group:'CAPTURE',d:'録音・文字化・素材。'},'music-suite':{e:'https://norinori-jan.github.io/music-suite/',i:'🎼',group:'MUSIC',d:'音楽制作の中核。'},'lead-sheet':{e:'https://norinori-jan.github.io/lead-sheet/',i:'🎵',group:'MUSIC',d:'リードシート化・共有。'},'table-pad':{e:'https://norinori-jan.github.io/table-pad/',i:'📊',group:'DATA',d:'表・集合・フロー・可視化。'},'storage-check':{e:'https://norinori-jan.github.io/storage-check/',i:'💾',group:'SYSTEM',d:'保存領域を点検。'}};
const purposes={produce:{title:'🎨 作る',items:[['🎼 音楽を作る','music-suite'],['🎵 リードシートを作る','lead-sheet'],['📊 表・フローを作る','table-pad'],['🎙 素材を録る','voice-pad']]},understand:{title:'🧠 整理する',items:[['🧠 頭の中を整理','flow-mind'],['📚 知識を整理','quick-ref'],['🥋 AIへの質問を整理','ai-dojo'],['📊 表・フローを整理','table-pad']]},practice:{title:'📚 学ぶ',items:[['🗣 英語を使う','speak-native'],['👂 耳を鍛える','ear-first'],['🥋 AIの使い方を鍛える','ai-dojo']]},capture:{title:'🎙 残す',items:[['🎙 声・音声を残す','voice-pad'],['🧠 意図を残す','flow-mind'],['📚 知識を残す','quick-ref'],['📊 構造を残す','table-pad']]},review:{title:'🔍 振り返る',items:[['🧠 自分の意図・流れ','flow-mind'],['📚 学んだこと','quick-ref'],['🎼 作った曲','music-suite'],['📊 整理した構造','table-pad']]}};
const $=s=>document.querySelector(s),KEY='flow_hub_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{started:0,q:[]}}catch(e){return{started:0,q:[]}}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s))}
function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function receiveHandoff(){try{const m=location.hash.match(/^#hub_handoff_v1=(.+)$/);if(!m)return;const h=JSON.parse(decodeURIComponent(m[1]));if(!h||h.protocol!=='hub_handoff_v1')return;const s=load();s.lastApp=h.source||s.lastApp;s.lastPurpose='review';s.lastStatus=h.payload&&h.payload.status||'completed';s.lastAt=h.createdAt||new Date().toISOString();s.lastHandoff=h;s.nextAction=h.payload&&h.payload.nextAction||null;s.nextActionMessage=h.payload&&h.payload.message||'';s.nextActionRecommendation=h.payload&&h.payload.recommendation||null;const raw=h.payload&&h.payload.activity||null;s.activity=window.HubActivityModel?HubActivityModel.normalize(h):raw;save(s);history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
function openApp(k){const s=load();s.lastApp=k;save(s);location.href=apps[k].e}
function showPurpose(k){const p=purposes[k];$('#purposeTitle').textContent=p.title;$('#purposeBody').innerHTML=p.items.map(x=>'<button class="small" data-app="'+x[1]+'">'+x[0]+'</button>').join(' ')}
function renderActivity(a){if(!a)return;const m=window.HubActivityModel?HubActivityModel.normalize({payload:{activity:a}}):a;const steps=m.completedSteps||[],outputs=m.outputs||[],used=m.appsUsed||[],ref=m.sourceRef||null;$('#activityCard').style.display='block';$('#activityBody').innerHTML='<div class="activity-grid"><div class="activity-item"><b>内容</b><span>'+esc(m.projectName||m.summary||'記録された活動')+'</span></div><div class="activity-item"><b>現在ステージ <span class="status-pill">'+esc(m.statusLabel||m.status||'opened')+'</span></b><span>'+esc(m.stage||'')+'</span></div><div class="activity-item activity-wide"><b>使用したアプリ</b><span>'+esc(used.length?used.join(' → '):m.app||'記録なし')+'</span></div><div class="activity-item activity-wide"><b>完了した工程</b><div class="steps">'+(steps.length?steps.map(x=>'<span class="step">✓ '+esc(x)+'</span>').join(''):'<span class="sub">まだ完了工程なし</span>')+'</div></div><div class="activity-item activity-wide"><b>成果物</b><span>'+(outputs.length?outputs.map(esc).join(' '):'記録なし')+'</span></div>'+(m.semanticEvents&&m.semanticEvents.length?'<div class="activity-item activity-wide"><b>直前の実績</b><span>'+esc(m.semanticEvents[m.semanticEvents.length-1].detail||m.semanticEvents[m.semanticEvents.length-1].type)+'</span></div>':'')+(ref?'<div class="activity-item activity-wide"><b>原本・最後の操作先</b><a class="btn small" href="'+esc(ref)+'">原本を開く</a></div>':'')+'</div>'}
function render(){const s=load();$('#status').textContent=s.lastStatus==='completed'?'完了：'+(s.lastApp||'専門アプリ')+' から戻りました。':s.started?'セッション中':'セッション未開始';const n=s.nextActionRecommendation;if(n&&(n.sourceRef||(n.app&&apps[n.app]))){$('#purposeTitle').textContent='次の一手';$('#purposeBody').innerHTML='<div class="sub">'+esc(s.activity&&s.activity.summary||'専門アプリの実績を受け取りました。')+'</div><div class="next-action"><div class="body"><b>'+esc(n.label||'次の工程を開く')+'</b><div class="sub">'+esc(s.nextActionMessage||'続きの作業を選べます。')+'</div></div><button class="pri small" data-next="1">続ける</button></div>'}renderActivity(s.activity);const ref=s.lastHandoff&&s.lastHandoff.sourceRef;$('#continue').innerHTML=ref?'<div class="continue"><div class="body"><b>最後に使った専門アプリ</b><div class="sub">原本から続けます。</div></div><button class="pri small" data-source-ref="1">続ける</button></div>':'<div class="sub">まだありません。目的を選んで始めましょう。</div>';$('#queue').innerHTML=s.q&&s.q.length?s.q.map((x,i)=>'<div>'+esc(x)+' <button class="small" data-go="'+i+'">開く</button></div>').join(''):'<div class="sub">入口メモはここに並びます。</div>';$('#apps').innerHTML=Object.entries(apps).map(([k,v])=>'<div class="app"><span class="tag">'+v.group+'</span><h3>'+v.i+' '+k+'</h3><p>'+v.d+'</p><a class="btn small" href="'+v.e+'">開く</a></div>').join('')}
document.addEventListener('click',e=>{const p=e.target.closest('[data-purpose]');if(p){const s=load();s.lastPurpose=p.dataset.purpose;save(s);showPurpose(p.dataset.purpose);return}const n=e.target.closest('[data-next]');if(n){const r=load().nextActionRecommendation;if(r&&r.sourceRef)location.href=r.sourceRef;else if(r&&r.app&&apps[r.app])openApp(r.app);return}const sr=e.target.closest('[data-source-ref]');if(sr){const u=load().lastHandoff&&load().lastHandoff.sourceRef;if(u)location.href=u;return}const a=e.target.closest('[data-app]');if(a){openApp(a.dataset.app);return}const act=e.target.closest('[data-action]');if(act){const s=load();if(act.dataset.action==='start')s.started=Date.now();if(act.dataset.action==='clear'){localStorage.removeItem(KEY);render();return}if(act.dataset.action==='capture'){const x=prompt('今やること／残すこと');if(x){s.q=s.q||[];s.q.push(x)}}save(s);render();return}const g=e.target.closest('[data-go]');if(g){const s=load(),x=s.q[+g.dataset.go];if(x)openApp(x.includes('音楽')?'music-suite':x.includes('表')?'table-pad':'quick-ref')}});
receiveHandoff();
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW registration failed:', err));
  });
}
</script>
</body>
</html>
